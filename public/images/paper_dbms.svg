  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#334155">Ananthasagar, Hasanparthy, Warangal, Telangana - 506371</text>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">School of Computer Science &amp; Artificial Intelligence</text>
  <text x="400" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">B.Tech II Year II Semester End Examination, May 2024</text>
  
  <line x1="40" y1="160" x2="760" y2="160" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Course Metadata Table -->
  <text x="50" y="185" font-size="14" font-weight="bold" fill="#0f172a">Course Code: 22CS402</text>
  <text x="450" y="185" font-size="14" font-weight="bold" fill="#0f172a">Regulations: R22</text>
  <text x="50" y="210" font-size="14" font-weight="bold" fill="#0f172a">Course: DATABASE MANAGEMENT SYSTEMS</text>
  <text x="450" y="210" font-size="14" font-weight="bold" fill="#0f172a">Branch: CSE</text>
  <text x="50" y="235" font-size="13" fill="#334155">Time: 3 Hours</text>
  <text x="450" y="235" font-size="13" fill="#334155">Max. Marks: 60 Marks</text>
  
  <line x1="40" y1="250" x2="760" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  
  <text x="50" y="275" font-size="12" font-style="italic" fill="#475569">Instructions: Answer all questions in PART-A (10 x 2 = 20 Marks). Answer any FOUR full questions in PART-B (4 x 10 = 40 Marks).</text>
  
  <rect x="40" y="295" width="720" height="28" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="400" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PART - A (Short Answer Questions - 20 Marks)</text>
  
  <text x="50" y="345" font-size="13" fill="#0f172a">1. a) State the key advantages of DBMS over traditional file processing systems.</text>
  <text x="700" y="345" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO1]</text>
  
  <text x="50" y="380" font-size="13" fill="#0f172a">   b) What is physical and logical data independence in 3-tier ANSI-SPARC architecture?</text>
  <text x="700" y="380" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO1]</text>
  
  <text x="50" y="415" font-size="13" fill="#0f172a">   c) Distinguish between Primary Key, Candidate Key, and Super Key with an example.</text>
  <text x="700" y="415" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO2]</text>
  
  <text x="50" y="450" font-size="13" fill="#0f172a">   d) Write relational algebra expressions for Natural Join and Division operations.</text>
  <text x="700" y="450" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO2]</text>
  
  <text x="50" y="485" font-size="13" fill="#0f172a">   e) Define Functional Dependency and write Armstrong's Axioms.</text>
  <text x="700" y="485" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO3]</text>

  <rect x="40" y="520" width="720" height="28" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="400" y="539" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PART - B (Long Answer Questions - 40 Marks)</text>
  
  <text x="400" y="575" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">UNIT - I</text>
  <text x="50" y="605" font-size="13" fill="#0f172a">2. Construct an Entity-Relationship (ER) diagram for a University Management System.</text>
  <text x="70" y="625" font-size="13" fill="#0f172a">Convert into relational schemas with appropriate primary and foreign key constraints.</text>
  <text x="700" y="615" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO1]</text>
  
  <text x="400" y="655" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">(OR)</text>
  
  <text x="50" y="685" font-size="13" fill="#0f172a">3. Write SQL queries for Sailor(sid, sname, rating, age), Boat(bid, bname, color), Reserves(sid, bid, day):</text>
  <text x="70" y="705" font-size="13" fill="#0f172a">(i) Find names of sailors who reserved red boats, (ii) Find sailors who reserved all boats.</text>
  <text x="700" y="695" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO2]</text>
  
  <text x="400" y="745" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">UNIT - II</text>
  <text x="50" y="775" font-size="13" fill="#0f172a">4. Given relation R(A, B, C, D, E) and FDs F = {A -> BC, CD -> E, B -> D, E -> A}.</text>
  <text x="70" y="795" font-size="13" fill="#0f172a">Find all candidate keys of R. Test whether R is in 3NF and BCNF. Decompose if needed.</text>
  <text x="700" y="785" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO3]</text>

  <line x1="40" y1="1020" x2="760" y2="1020" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="1045" text-anchor="middle" font-size="11" fill="#64748b">*** END OF QUESTION PAPER • SR UNIVERSITY EXAMINATION BRANCH ***</text>
