  <text x="400" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a8a" letter-spacing="2">SR UNIVERSITY</text>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#334155">Ananthasagar, Hasanparthy, Warangal, Telangana - 506371</text>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">School of Computer Science &amp; Artificial Intelligence</text>
  <text x="400" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">B.Tech II Year I Semester Mid-Term Examination - I, October 2024</text>
  
  <line x1="40" y1="160" x2="760" y2="160" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Course Metadata Table -->
  <text x="50" y="185" font-size="14" font-weight="bold" fill="#0f172a">Course Code: 22CS301</text>
  <text x="450" y="185" font-size="14" font-weight="bold" fill="#0f172a">Regulations: R22</text>
  <text x="50" y="210" font-size="14" font-weight="bold" fill="#0f172a">Course: DATA STRUCTURES &amp; ALGORITHMS</text>
  <text x="450" y="210" font-size="14" font-weight="bold" fill="#0f172a">Branch: CSE / AIML</text>
  <text x="50" y="235" font-size="13" fill="#334155">Time: 90 Minutes</text>
  <text x="450" y="235" font-size="13" fill="#334155">Max. Marks: 30 Marks</text>
  
  <line x1="40" y1="250" x2="760" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Instructions -->
  <text x="50" y="275" font-size="12" font-style="italic" fill="#475569">Instructions: Answer all questions in PART-A (5 x 2 = 10 Marks). Answer any TWO full questions in PART-B (2 x 10 = 20 Marks).</text>
  
  <rect x="40" y="295" width="720" height="28" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="400" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PART - A (Short Answer Questions - 10 Marks)</text>
  
  <!-- Part A Questions -->
  <text x="50" y="350" font-size="13" fill="#0f172a">1. a) Define Big-O, Omega, and Theta asymptotic notations with mathematical bounds.</text>
  <text x="700" y="350" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO1]</text>
  
  <text x="50" y="390" font-size="13" fill="#0f172a">   b) Illustrate how a circular queue overcomes memory wastage in linear array queues.</text>
  <text x="700" y="390" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO1]</text>
  
  <text x="50" y="430" font-size="13" fill="#0f172a">   c) Convert the infix expression ((A + B) * C - (D - E)) ^ (F + G) into postfix notation.</text>
  <text x="700" y="430" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO2]</text>
  
  <text x="50" y="470" font-size="13" fill="#0f172a">   d) What is the balance factor of an AVL tree node? State the 4 rotation cases.</text>
  <text x="700" y="470" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO2]</text>
  
  <text x="50" y="510" font-size="13" fill="#0f172a">   e) Differentiate between singly linked list and doubly linked list deletion complexity.</text>
  <text x="700" y="510" font-size="12" font-weight="bold" fill="#1e3a8a">[2M, CO2]</text>
  
  <rect x="40" y="540" width="720" height="28" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="400" y="559" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PART - B (Long Answer Questions with Choice - 20 Marks)</text>
  
  <!-- Unit 1 -->
  <text x="400" y="595" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">UNIT - I</text>
  
  <text x="50" y="625" font-size="13" fill="#0f172a">2. Design an algorithm to evaluate a postfix expression using a single stack.</text>
  <text x="70" y="645" font-size="13" fill="#0f172a">Trace the step-by-step evaluation for the expression: 6 5 2 3 + 8 * + 3 + *.</text>
  <text x="700" y="635" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO1]</text>
  
  <text x="400" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">(OR)</text>
  
  <text x="50" y="705" font-size="13" fill="#0f172a">3. Explain the step-by-step implementation of insertion and deletion at any arbitrary position</text>
  <text x="70" y="725" font-size="13" fill="#0f172a">in a Doubly Linked List with C++/Java pseudo-code and memory diagrams.</text>
  <text x="700" y="715" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO1]</text>
  
  <!-- Unit 2 -->
  <text x="400" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">UNIT - II</text>
  
  <text x="50" y="795" font-size="13" fill="#0f172a">4. Construct an AVL Tree by inserting the following sequence of keys step-by-step:</text>
  <text x="70" y="815" font-size="13" fill="#0f172a">64, 1, 44, 26, 13, 110, 98, 85. Clearly state every rotation performed (LL, RR, LR, RL).</text>
  <text x="700" y="805" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO2]</text>
  
  <text x="400" y="845" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">(OR)</text>
  
  <text x="50" y="875" font-size="13" fill="#0f172a">5. Write iterative algorithms for Preorder, Inorder, and Postorder traversals of a Binary Tree</text>
  <text x="70" y="895" font-size="13" fill="#0f172a">using an explicit stack. Derive their time and space complexity.</text>
  <text x="700" y="885" font-size="12" font-weight="bold" fill="#1e3a8a">[10M, CO2]</text>
  
  <!-- Footer -->
